<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>结构样稿 · 备考节奏</title>
<!--
  结构样稿，不是正式界面。数据全是假的。
  这一版只改**导航层级**，四个页面的内容保持正式版现在的样子（不重组）。

  结构：
    第 1 层  主页        —— 今日打卡 + 并列的功能入口卡片（没有底部 tab）
    第 2 层  备考计划    —— 底部 tab：总计划 / 成果 / 状态 / 设置
-->
<style>
:root {
  --bg: #f6f4f1; --card: #fff;
  --ink: #1a1815;
  --ink-2: rgba(58,53,46,.62);
  --ink-3: rgba(58,53,46,.34);
  --line: rgba(58,53,46,.10);
  --primary: #ab8752; --primary-s: rgba(171,135,82,.13);
  --done: #ab8752; --half: #cf9a3e;
  --radius: 18px; --radius-s: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; background: #e5e5ea; color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
#app {
  max-width: 480px; margin: 0 auto; min-height: 100vh;
  background: var(--bg); position: relative; padding-bottom: 24px;
}
#app.has-tabs { padding-bottom: 92px; }
.draft-bar {
  max-width: 480px; margin: 0 auto; background: #26231f; color: #f0e6d6;
  font-size: 12px; padding: 6px 16px; text-align: center; letter-spacing: .02em;
}

.top { padding: 22px 20px 4px; }
.top h1 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -.5px; }
.top .sub { margin-top: 4px; font-size: 13.5px; color: var(--ink-2); }
.section { padding: 0 16px; margin-top: 14px; }
.card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; }
.section-title { margin: 0 0 8px 4px; font-size: 12.5px; color: var(--ink-3); letter-spacing: .04em; }
.row { display: flex; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--ink-3); }
.tiny { font-size: 12px; }
.footnote { margin: 8px 4px 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.6; }

/* ---------- 应用返回条 ---------- */
.apphead {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: 6px; padding: 10px 12px 6px;
  border-bottom: 1px solid var(--line);
}
.back {
  border: 0; background: none; font: inherit; font-size: 15px; color: var(--primary);
  cursor: pointer; padding: 6px 10px; border-radius: 10px;
}
.apphead .ah-t { font-size: 16px; font-weight: 600; }

/* ---------- 主页的入口卡片（并列，大小一样） ---------- */
.entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.entry {
  border: 0; text-align: left; cursor: pointer; font: inherit;
  background: var(--card); border-radius: var(--radius); padding: 16px 14px;
  min-height: 118px; display: flex; flex-direction: column;
}
.entry .en { font-size: 16px; font-weight: 600; }
.entry .ed { font-size: 12px; color: var(--ink-3); margin-top: 4px; line-height: 1.5; flex: 1; }
.entry .ea { font-size: 12.5px; color: var(--primary); font-weight: 600; margin-top: 8px; }
.entry.soon { opacity: .55; }

/* ---------- 任务 ---------- */
.task { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.tick { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(60,60,67,.28); margin-top: 3px; }
.tick.done { background: var(--done); border-color: var(--done); }
.tick.half { background: linear-gradient(to right, var(--half) 0 50%, transparent 50% 100%); border-color: var(--half); }
.tname { font-size: 16px; }
.tmeta { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.tmin { margin-left: auto; font-size: 13px; color: var(--ink-3); }
.moods { display: flex; gap: 6px; margin-top: 4px; }
.mood { flex: 1; padding: 11px 4px; border: 0; border-radius: 11px; background: rgba(120,120,128,.10); font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.mood.on { background: var(--primary-s); color: var(--primary); font-weight: 600; }

/* ---------- 数字 ---------- */
.metrics { display: flex; background: var(--card); border-radius: var(--radius); padding: 16px 8px; }
.metric { flex: 1; text-align: center; }
.metric .v { font-size: 26px; font-weight: 650; letter-spacing: -.5px; }
.metric .k { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ---------- 长条热力图 ---------- */
.heatmap { display: flex; gap: 3px; overflow-x: auto; padding: 2px 0 4px; }
.hm-col { display: flex; flex-direction: column; gap: 3px; }
.hm-cell { width: 11px; height: 11px; border-radius: 3px; background: #efeae1; }
.hm-cell.lv1 { background: #e6d5b4; } .hm-cell.lv2 { background: #c8a874; }
.hm-cell.lv3 { background: #ab8752; } .hm-cell.lv4 { background: #8b6b3d; }

/* ---------- 单月日历（跟正式版一致：日期 + 小时 + 深浅） ---------- */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-head { text-align: center; font-size: 11px; color: var(--ink-3); padding: 2px 0 4px; }
.cal-cell {
  border: 0; font: inherit; cursor: pointer; border-radius: 10px;
  padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: #faf8f5; min-height: 46px;
}
.cal-cell.out { visibility: hidden; }
.cal-cell.today { outline: 1.5px solid var(--primary); }
.cal-cell .cal-d { font-size: 13px; }
.cal-cell .cal-mini { font-size: 10px; color: var(--ink-3); }
.cal-cell.rlv1 { background: #f7f0e2; } .cal-cell.rlv2 { background: #f0e2c8; }
.cal-cell.rlv3 { background: #e8d4ac; } .cal-cell.rlv4 { background: #dfc48c; }

/* ---------- 阶段 ---------- */
.stage { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.stage:last-child { border-bottom: 0; }
.stage .sn { flex: 0 0 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: rgba(120,120,128,.10); color: var(--ink-2); font-size: 12px; font-weight: 600; }
.stage.cur .sn { background: var(--primary); color: #fff; }
.stage .st { font-size: 15px; }
.stage .sd { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ---------- 档位 ---------- */
.lv-row { display: flex; align-items: baseline; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.lv-row:last-child { border-bottom: 0; }
.lv-n { flex: 0 0 58px; font-size: 13.5px; }
.lv-b { flex: 0 0 auto; font-size: 11.5px; padding: 2px 8px; border-radius: 20px; background: rgba(120,120,128,.10); color: var(--ink-2); }
.lv-b.lv2 { background: var(--primary-s); color: var(--primary); }
.lv-b.lv3 { background: var(--primary); color: #fff; }
.lv-b.lv4 { background: var(--done); color: #fff; }
.lv-s { flex: 1; min-width: 0; font-size: 12px; color: var(--ink-3); }

.adv-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.adv-row:last-child { border-bottom: 0; }
.adv-row .adv-t { flex: 1; min-width: 0; font-size: 13px; line-height: 1.6; color: var(--ink-2); }

.list-item { display: flex; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.list-item:last-child { border-bottom: 0; }
.list-item .li-t { flex: 1; }
.list-item .li-v { color: var(--ink-3); font-size: 12.5px; }

/* ---------- 底部 tab（只在"备考计划"模块里出现） ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; display: flex;
  background: rgba(249,249,249,.94); border-top: 1px solid var(--line);
  padding: 6px 0 10px;
}
.tab { flex: 1; border: 0; background: none; font: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; color: var(--ink-3); padding: 4px 0; }
.tab.on { color: var(--primary); font-weight: 600; }
.tab svg { width: 22px; height: 22px; }

.btn { border: 0; font: inherit; border-radius: 12px; padding: 11px 16px; cursor: pointer; font-size: 14.5px; font-weight: 600; background: rgba(120,120,128,.12); color: var(--ink); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.block { display: block; width: 100%; }
.btn.ghost { background: transparent; color: var(--primary); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }

@media (min-width: 820px) {
  #app, .tabbar, .draft-bar { max-width: 720px; }
  .entry-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div class="draft-bar">结构样稿 · 假数据 · 不是正式界面</div>
<div id="app"></div>
<script>
'use strict';

var ICON = {
  plan: '<path d="M4.5 7h15M4.5 12h15M4.5 17h9"/>',
  results: '<rect x="3.6" y="5" width="16.8" height="15" rx="3"/><path d="M8 9.5h8M8 13h8M8 16.5h5"/>',
  status: '<path d="M6 19v-6M12 19V5.5M18 19v-9"/>',
  settings: '<path d="M4 8.5h8M17 8.5h3M4 15.5h3M12 15.5h8"/><circle cx="14.5" cy="8.5" r="2.2"/><circle cx="9.5" cy="15.5" r="2.2"/>'
};
var TABS = [
  { id: 'plan', label: '总计划' },
  { id: 'results', label: '成果' },
  { id: 'status', label: '状态' },
  { id: 'settings', label: '设置' }
];

/* module = null 表示在主页；'plan' 表示进了备考计划模块 */
var state = { module: null, tab: 'plan', calMonth: 10 };   // calMonth: 0-based
var app = document.getElementById('app');

function tabbar() {
  return '<div class="tabbar">' + TABS.map(function (t) {
    return '<button class="tab ' + (t.id === state.tab ? 'on' : '') + '" data-tab="' + t.id + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      ICON[t.id] + '</svg>' + t.label + '</button>';
  }).join('') + '</div>';
}
function card(inner) { return '<div class="section"><div class="card">' + inner + '</div></div>'; }
function secTitle(t) { return '<div class="section"><div class="section-title">' + t + '</div></div>'; }

/* ================= 第 1 层：主页（没有底部 tab） ================= */
function renderHome() {
  return '<div class="top"><div class="sub">2026年11月18日 周三</div><h1>今天</h1>' +
      '<div class="sub">强化期 · 已完成 0 / 3 项 · 连续 30 天</div></div>' +

    card(
      '<div class="task"><span class="tick"></span><div><div class="tname">申论 · 小题</div>' +
        '<div class="tmeta">认真写完 2 道，对照参考答案改</div></div><span class="tmin">1 小时 20 分</span></div>' +
      '<div class="task"><span class="tick"></span><div><div class="tname">资料 · 刷题</div>' +
        '<div class="tmeta">2 组 · 40 题</div></div><span class="tmin">40 分钟</span></div>' +
      '<div class="task"><span class="tick"></span><div><div class="tname">错题复盘</div>' +
        '<div class="tmeta">把今天做错的题重做一遍</div></div><span class="tmin">30 分钟</span></div>'
    ) +

    '<div class="section"><div class="card"><div class="tiny muted" style="margin-bottom:6px">今天感觉</div>' +
      '<div class="moods"><button class="mood">太轻松</button><button class="mood on">刚好</button>' +
      '<button class="mood">有点累</button><button class="mood">太难了</button></div></div></div>' +

    secTitle('我的功能') +
    '<div class="section"><div class="entry-grid">' +
      '<button class="entry" data-open="plan">' +
        '<span class="en">备考计划</span>' +
        '<span class="ed">强化期 · 距考试 53 天<br>今天 3 项任务 · 完成 0</span>' +
        '<span class="ea">进去看看 ›</span>' +
      '</button>' +
      '<button class="entry soon" data-soon>' +
        '<span class="en">行测工具</span>' +
        '<span class="ed">速算练习、图形速判…<br>还没想好</span>' +
        '<span class="ea">待定</span>' +
      '</button>' +
      '<button class="entry soon" data-soon>' +
        '<span class="en">留个位置</span>' +
        '<span class="ed">以后加的功能和备考计划并列放</span>' +
        '<span class="ea">待定</span>' +
      '</button>' +
    '</div><div class="footnote">功能卡片并列，大小一样。以后加新功能就往这里加，不会挤。</div></div>';
}

/* ================= 第 2 层：备考计划模块 ================= */
function renderModule() {
  var body;
  if (state.tab === 'plan') body = tabPlan();
  else if (state.tab === 'results') body = tabResults();
  else if (state.tab === 'status') body = tabStatus();
  else body = tabSettings();
  return '<div class="apphead"><button class="back" data-home>‹ 主页</button>' +
    '<span class="ah-t">备考计划</span></div>' + body + tabbar();
}

/* ---------- 总计划（内容跟正式版一致） ---------- */
function tabPlan() {
  return '<div class="top"><h1>总计划</h1><div class="sub">距离 2027年1月19日 还有 53 个学习日</div></div>' +

    card(
      '<div class="stage"><span class="sn">1</span><div><div class="st">基础期</div>' +
        '<div class="sd">11月19日 – 11月21日 · 3 个学习日</div></div></div>' +
      '<div class="stage cur"><span class="sn">2</span><div><div class="st">强化期 · 进行中</div>' +
        '<div class="sd">11月22日 – 1月3日 · 37 个学习日</div></div></div>' +
      '<div class="stage"><span class="sn">3</span><div><div class="st">冲刺期</div>' +
        '<div class="sd">1月4日 – 1月19日 · 14 个学习日</div></div></div>'
    ) +

    card('<div class="tiny" style="color:var(--ink-2)">按现在的进度：<b>11月21日</b> 听完所有课，' +
      '<b>1月4日</b> 开始刷套卷，之后有 <b>13</b> 个学习日做套卷。</div>') +

    secTitle('日程') +
    '<div class="section"><div class="card">' + monthCal() + '</div>' +
      '<div class="footnote">日历里每格是那天的<b>计划量</b>。计划页看“要做什么”。</div></div>' +

    secTitle('听课进度') +
    card('<div class="list-item"><span class="li-t">共 29 节 · 已听 27.25 节</span>' +
      '<span class="li-v">还剩 1.75 节</span></div>' +
      '<div class="list-item"><span class="li-t">资料</span><span class="li-v">剩 1 节</span></div>' +
      '<div class="list-item"><span class="li-t">言语</span><span class="li-v">剩 0.75 节</span></div>' +
      '<div class="list-item"><span class="li-t">其余七科</span><span class="li-v">剩 0 节</span></div>');
}

/* ---------- 成果（内容跟正式版记录页一致：数字 + 长条 + 单月日历） ---------- */
function tabResults() {
  return '<div class="top"><h1>成果</h1><div class="sub">你已经坚持了 48 天，从 9月19日 开始</div></div>' +

    '<div class="section"><div class="metrics">' +
      '<div class="metric"><div class="v">972</div><div class="k">累计做题</div></div>' +
      '<div class="metric"><div class="v">27.8</div><div class="k">听课节数</div></div>' +
      '<div class="metric"><div class="v">111</div><div class="k">学习小时</div></div>' +
    '</div><div class="footnote">现在连续 30 天。听课大约 46 小时。</div></div>' +

    secTitle('最近三个月') +
    card('<div class="heatmap">' + heatCols(120) + '</div>' +
      '<div class="tiny muted" style="margin-top:6px">每一格是一天，颜色越深学的越久。' +
      '浅色的日子是休息或没学——都正常。</div>') +

    secTitle('按天记录') +
    '<div class="section"><div class="card">' + monthCal() + '</div>' +
      '<div class="footnote">这里的每格是那天的<b>实际完成量</b>，点开看明细。' +
      '计划页和这里用的是同一个日历，一行数据不同。</div></div>';
}

/* ---------- 状态（内容跟正式版统计页一致） ---------- */
function tabStatus() {
  var levels = [
    ['资料', '专项强化', 2, '还差 12 个点到 85%'],
    ['言语', '限时提速', 3, '已经到目标，可以开始压时间了'],
    ['判推逻辑', '保持手感', 4, '连续两次稳在目标以上'],
    ['判推图形', '专项强化', 2, '还没录过正确率，先按练的量走'],
    ['定义类比', '认识题型', 1, '先把题型认全、别急着掐表'],
    ['政治理论', '认识题型', 1, '离目标还有 25 个点'],
    ['数量', '认识题型', 1, '这科没设目标，按练的量走']
  ].map(function (r) {
    return '<div class="lv-row"><span class="lv-n">' + r[0] + '</span>' +
      '<span class="lv-b lv' + r[2] + '">' + r[1] + '</span><span class="lv-s">' + r[3] + '</span></div>';
  }).join('');

  return '<div class="top"><h1>状态</h1><div class="sub">这些数字用来把计划调得越来越贴合你</div></div>' +

    '<div class="section"><div class="metrics">' +
      '<div class="metric"><div class="v">30</div><div class="k">连续打卡</div></div>' +
      '<div class="metric"><div class="v">48</div><div class="k">学习天数</div></div>' +
      '<div class="metric"><div class="v">77%</div><div class="k">完成任务</div></div>' +
    '</div></div>' +

    secTitle('成绩记录') +
    card('<div class="between row"><span>已记录 2 次</span>' +
      '<button class="btn sm primary">记录</button></div>' +
      '<div class="tiny muted" style="margin-top:8px">11月18日 模考　资料 60%</div>' +
      '<div class="tiny muted">11月18日 模块刷题　言语 50%</div>') +

    secTitle('按你的成绩看') +
    card('<div class="adv-row"><div class="adv-t">资料最近一次 60%，目标 85%。差得有点多，要不要给它多排点题？</div>' +
      '<button class="btn sm primary">多排点</button></div>') +

    secTitle('各科在第几档') +
    card(levels) +

    secTitle('做题速度') +
    card('<div class="list-item"><span class="li-t">资料</span><span class="li-v">17 次 · 你做一题 2.1 分</span></div>' +
      '<div class="list-item"><span class="li-t">言语</span><span class="li-v">17 次 · 1.6 分</span></div>' +
      '<div class="list-item"><span class="li-t">判推逻辑</span><span class="li-v">20 次 · 1.7 分</span></div>') +

    secTitle('累计') +
    card('<div class="list-item"><span class="li-t">计划总时长</span><span class="li-v">144 小时 30 分</span></div>' +
      '<div class="list-item"><span class="li-t">已完成</span><span class="li-v">111 小时 10 分</span></div>' +
      '<div class="list-item"><span class="li-t">你记录的实际用时</span><span class="li-v">53 小时 11 分</span></div>');
}

/* ---------- 设置（先保持正式版的一页到底，等前面定了再拆） ---------- */
function tabSettings() {
  return '<div class="top"><h1>设置</h1><div class="sub">改完以后，点最下面那个按钮重排后面的计划</div></div>' +
    secTitle('怎么用它') +
    card('<div class="tiny muted">全自动 / 半自动 / 自己排（现在是半自动）</div>') +
    secTitle('考试与时间') +
    card('<div class="list-item"><span class="li-t">考试日期</span><span class="li-v">2027-01-19</span></div>' +
      '<div class="list-item"><span class="li-t">工作日 / 周末每天可用</span><span class="li-v">2–4 / 6–8 小时</span></div>' +
      '<div class="list-item"><span class="li-t">每周休息日</span><span class="li-v">周三、周日</span></div>') +
    secTitle('听课') +
    card('<div class="list-item"><span class="li-t">每节课时长 / 倍速</span><span class="li-v">150 分钟 / 1.5 倍</span></div>' +
      '<div class="list-item"><span class="li-t">各模块课节数</span><span class="li-v">共 29 节</span></div>') +
    secTitle('各模块强度') +
    card('<div class="tiny muted">每科：加强 / 正常 / 减少 / 不学</div>') +
    secTitle('学习顺序') +
    card('<div class="tiny muted">行测八科的先后 + 申论什么时候开始</div>') +
    secTitle('高级参数 / 数据 / 开发者工具') +
    card('<div class="tiny muted">默认值就是推荐值。数据可以导出导入。</div>') +
    '<div class="section"><button class="btn primary block">重新生成后面的计划</button></div>' +
    '<div class="footnote">设置这一页先保持正式版的样子（一页到底）。' +
    '等前面四页定下来，再讨论怎么拆成二级页。</div>';
}

/* ---------- 单月日历（跟正式版一样，可翻月） ---------- */
var FAKE = {};
function fakeMinutes(y, m, d) {
  var k = y + '-' + m + '-' + d;
  if (FAKE[k] === undefined) {
    var seed = (y * 372 + m * 31 + d) % 97;
    var isRest = ((new Date(y, m - 1, d)).getDay() === 3 || (new Date(y, m - 1, d)).getDay() === 0);
    FAKE[k] = isRest ? 0 : (seed % 9 === 0 ? 0 : 25 + (seed % 11) * 22);
  }
  return FAKE[k];
}
function level(mins) { return !mins ? 0 : mins < 60 ? 1 : mins < 150 ? 2 : mins < 300 ? 3 : 4; }
function monthCal() {
  var y = 2026, m = state.calMonth;                 // m: 0-based
  var first = new Date(y, m, 1), last = new Date(y, m + 1, 0);
  var back = first.getDay() === 0 ? 6 : first.getDay() - 1;
  var gridStart = new Date(y, m, 1 - back);
  var fwd = last.getDay() === 0 ? 0 : 7 - last.getDay();

  var heads = ['一', '二', '三', '四', '五', '六', '日']
    .map(function (w) { return '<div class="cal-head">' + w + '</div>'; }).join('');
  var cells = '';
  for (var i = 0; i < 42; i++) {
    var d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    if (d.getMonth() !== m) { cells += '<div class="cal-cell out"></div>'; continue; }
    var mins = fakeMinutes(2026, m + 1, d.getDate());
    var lv = level(mins);
    var isToday = (m === 10 && d.getDate() === 18);
    cells += '<button class="cal-cell rlv' + lv + (isToday ? ' today' : '') + '">' +
      '<span class="cal-d">' + d.getDate() + '</span>' +
      '<span class="cal-mini">' + (mins ? Math.round(mins / 60 * 10) / 10 + 'h' : '') + '</span></button>';
    if (i > 34 && d.getDate() === last.getDate()) break;
  }
  return '<div class="row between" style="align-items:center;margin-bottom:8px">' +
      '<button class="back" data-cal="-1">‹</button>' +
      '<span style="font-size:14px;font-weight:600">' + y + ' 年 ' + (m + 1) + ' 月</span>' +
      '<button class="back" data-cal="1"' + (m >= 11 ? ' style="opacity:.3"' : '') + '>›</button>' +
    '</div><div class="cal-grid">' + heads + cells + '</div>';
}
function heatCols(n) {
  var seed = 7;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  var cols = '';
  for (var c = 0; c < Math.ceil(n / 7); c++) {
    var cells = '';
    for (var w = 0; w < 7; w++) {
      var r = rnd();
      var lv = r < .18 ? 0 : r < .38 ? 1 : r < .6 ? 2 : r < .82 ? 3 : 4;
      cells += '<span class="hm-cell' + (lv ? ' lv' + lv : '') + '"></span>';
    }
    cols += '<span class="hm-col">' + cells + '</span>';
  }
  return cols;
}

function render() {
  var inModule = !!state.module;
  app.className = inModule ? 'has-tabs' : '';
  app.innerHTML = inModule ? renderModule() : renderHome();
  window.scrollTo(0, 0);
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-open],[data-home],[data-tab],[data-cal],[data-soon],.mood');
  if (!el) return;
  if (el.hasAttribute('data-open')) { state.module = 'plan'; state.tab = 'plan'; return render(); }
  if (el.hasAttribute('data-home')) { state.module = null; return render(); }
  if (el.hasAttribute('data-tab')) { state.tab = el.getAttribute('data-tab'); return render(); }
  if (el.hasAttribute('data-cal')) {
    var m = state.calMonth + Number(el.getAttribute('data-cal'));
    if (m < 0 || m > 11) return;
    state.calMonth = m; return render();
  }
  if (el.classList.contains('mood')) {
    var sibs = el.parentNode.querySelectorAll('.mood');
    for (var i = 0; i < sibs.length; i++) sibs[i].classList.remove('on');
    el.classList.add('on');
  }
});

render();
</script>
