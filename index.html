<!DOCTYPE html>
<html lang="zh-CN" style="background:#f1efea">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f1">
  <title>备考节奏</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- 加到手机桌面用。这一步跟体验模式无关，正式上架后要留着。 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="备考节奏">
</head>
<body style="margin:0;background:#f1efea">
  <!-- 这一块是"启动占位"。app.js 一跑起来就会把 #app 整个换掉。
       留在里面的意思是：万一脚本出错、或者文件没加载上，用户看到的是这句话，
       而不是一片白——白屏是最糟糕的失败形态，连"哪里错了"都无从说起。 -->
  <div id="app">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px;box-sizing:border-box;text-align:center;color:#7a7268;font:14px/2 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
      <div style="width:34px;height:34px;border-radius:50%;border:3px solid rgba(171,135,82,.25);border-top-color:#ab8752;animation:bootspin .9s linear infinite;margin-bottom:14px"></div>
      <div id="boot-tip">正在加载…</div>
      <div style="font-size:12.5px;opacity:.75;margin-top:4px">
        第一次打开会慢一点，之后会快很多。
      </div>
    </div>
  </div>
  <style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="overlay" class="overlay hidden"></div>

  <script>
    /* 出错就把错误摆到页面上。放在最前面，后面的脚本再崩也接得住。 */
    (function () {
      var shown = false;
      function show(msg) {
        if (shown) return;
        shown = true;
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;' +
          'max-height:55vh;overflow:auto;background:#2b2320;color:#ffe9d6;' +
          'font:12.5px/1.7 ui-monospace,Consolas,monospace;padding:14px 16px;' +
          'white-space:pre-wrap;word-break:break-all';
        box.textContent = '页面出错了（把这段发给开发者）：\n' + msg +
          '\n\n先试一次强制刷新：Ctrl + F5';
        document.body.appendChild(box);
      }
      /* window.onerror 只给"出错的位置"，不给"谁调用的"。
       * 真正要定位得有整条调用栈 —— e.error.stack 里就有。 */
      function stackOf(e) {
        try {
          if (e && e.error && e.error.stack) return '\n\n调用栈：\n' + e.error.stack;
        } catch (err) {}
        return '';
      }
      window.addEventListener('error', function (e) {
        if (e && e.target && e.target.tagName === 'SCRIPT') {
          show('脚本没加载上：' + (e.target.src || '') + '\n（服务器是不是没开？）');
          return;
        }
        var msg = e && e.message ? e.message : '未知错误';
        var file = e && e.filename ? e.filename : '';
        var line = e && e.lineno ? e.lineno : '';
        /* Safari 对第三方注入脚本常报 "Script error."，拿不到文件和行号。
         * 这种不要弹大黑框吓人；真正属于本项目的错误会带文件名和调用栈。 */
        if (msg === 'Script error.' && !file) {
          try { console.warn('忽略一个外部脚本错误（浏览器插件或翻译注入常见）'); } catch (err) {}
          return;
        }
        show(msg + '\n' + file + ':' + line + stackOf(e) +
          '\nUA: ' + navigator.userAgent + '\nURL: ' + location.href);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        show('未处理的 Promise 错误：' + (e.reason && e.reason.message ? e.reason.message : e.reason) +
          (e.reason && e.reason.stack ? '\n\n调用栈：\n' + e.reason.stack : ''));
      });
      /* 网络慢的时候给一个更明确的提示，别让人对着白屏猜。 */
      setTimeout(function () {
        var tip = document.getElementById('boot-tip');
        if (!tip) return;
        tip.innerHTML = '网络有点慢，还在加载……<br>' +
          '<button onclick="location.reload()" style="margin-top:10px;padding:8px 14px;' +
          'border:0;border-radius:10px;background:#ab8752;color:#fff;font:inherit;font-size:13px">' +
          '重新加载</button>';
      }, 8000);
    })();
  </script>
  <script src="js/config.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/store.js"></script>
  <!-- 体验模式。正式上架时删掉这一行，再按 js/demo.js 顶部的清单删干净。 -->
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>

  <script>
    /* 加到桌面之后能离线打开。
     * 本地开发（http / 局域网）不注册——否则改完 js 刷新还是旧的，会以为是代码没生效。 */
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
