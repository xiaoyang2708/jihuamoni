<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f1">
  <title>备考节奏</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- 加到手机桌面用。这一步跟体验模式无关，正式上架后要留着。 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="备考节奏">
</head>
<body>
  <!-- 这一块是"启动占位"。app.js 一跑起来就会把 #app 整个换掉。
       留在里面的意思是：万一脚本出错、或者文件没加载上，用户看到的是这句话，
       而不是一片白——白屏是最糟糕的失败形态，连"哪里错了"都无从说起。 -->
  <div id="app">
    <div style="padding:60px 28px;text-align:center;color:#7a7268;font-size:14px;line-height:2">
      <div>正在加载…</div>
      <div style="font-size:12.5px;opacity:.75">
        如果一直停在这里，按住 Ctrl 点刷新（Mac 是 ⌘ + Shift + R）。
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="overlay" class="overlay hidden"></div>

  <script>
    /* 出错就把错误摆到页面上。放在最前面，后面的脚本再崩也接得住。 */
    (function () {
      var shown = false;
      function show(msg) {
        if (shown) return;
        shown = true;
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;' +
          'max-height:55vh;overflow:auto;background:#2b2320;color:#ffe9d6;' +
          'font:12.5px/1.7 ui-monospace,Consolas,monospace;padding:14px 16px;' +
          'white-space:pre-wrap;word-break:break-all';
        box.textContent = '页面出错了（把这段发给开发者）：\n' + msg +
          '\n\n先试一次强制刷新：Ctrl + F5';
        document.body.appendChild(box);
      }
      /* window.onerror 只给"出错的位置"，不给"谁调用的"。
       * 真正要定位得有整条调用栈 —— e.error.stack 里就有。 */
      function stackOf(e) {
        try {
          if (e && e.error && e.error.stack) return '\n\n调用栈：\n' + e.error.stack;
        } catch (err) {}
        return '';
      }
      window.addEventListener('error', function (e) {
        if (e && e.target && e.target.tagName === 'SCRIPT') {
          show('脚本没加载上：' + (e.target.src || '') + '\n（服务器是不是没开？）');
          return;
        }
        show((e.message || '未知错误') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + stackOf(e));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        show('未处理的 Promise 错误：' + (e.reason && e.reason.message ? e.reason.message : e.reason) +
          (e.reason && e.reason.stack ? '\n\n调用栈：\n' + e.reason.stack : ''));
      });
    })();
  </script>
  <script src="js/config.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/store.js"></script>
  <!-- 体验模式。正式上架时删掉这一行，再按 js/demo.js 顶部的清单删干净。 -->
  <script src="js/demo.js"></script>
  <script src="js/app.js"></script>

  <script>
    /* 加到桌面之后能离线打开。
     * 本地开发（http / 局域网）不注册——否则改完 js 刷新还是旧的，会以为是代码没生效。 */
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
