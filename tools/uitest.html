<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>备考节奏 · 界面自测</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script>
    /* 提前挂上，任何脚本一报错就被记下来 */
    window.__errs = [];
    window.onerror = function (m) { window.__errs.push(String(m)); };
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <div id="undobar" class="undo-bar" role="status" aria-live="polite"></div>
  <div id="overlay" class="overlay hidden"></div>

  <script src="../js/config.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/stats.js"></script>
  <script src="../js/archive.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/feedback.js"></script>
  <script src="../js/focus.js"></script>
  <script src="../js/manual.js"></script>

  <script>
    /* =====================================================================
     * 造一份"刚走完问卷"的存档，塞进 localStorage。
     * 必须在 app.js 之前跑——app.js 是在加载时就把存档读进去的。
     *
     *   node server.js
     *   chrome --headless=new --virtual-time-budget=9000 \
     *          --dump-dom "http://localhost:5173/tools/uitest.html?case=demo&demo=1"
     * =================================================================== */

    (function () {
      var E = window.YT.engine;
      var MODULES = window.YT.MODULES;
      var today = E.toKey(new Date());

      var profile = {
        examDate: E.toKey(E.addDays(new Date(), 100)),
        base: 'zero',
        weekdayMinutes: 120,
        weekendMinutes: 240,
        restDays: [],
        lessonMinutes: 150,
        speed: 1.5,
        mode: 'semi',
        courseUnits: {},
        benchmarks: {},
        strength: {},
        createdAt: new Date().toISOString(),
      };
      MODULES.forEach(function (m) {
        profile.courseUnits[m.id] = m.courseUnits;
        profile.strength[m.id] = 'normal';
      });

      /* 问卷那一步要的是"还没生成计划"的状态 */
      var CASE0 = new URLSearchParams(location.search).get('case');
      if (CASE0 === 'onboard' || CASE0 === 'onboardmanual') {
        window.localStorage.setItem('yang-toolbox/v1', JSON.stringify({
          version: 1,
          userId: 'local-user',
          profile: null,
          roadmap: null,
          days: {},
          rounds: [],
          weeklyLog: [],
          ui: { screen: 'today', onboardStep: 0 },
          createdAt: new Date().toISOString(),
        }));
        return;
      }

      /* 自己排的用例：档案直接是 manual，days 空着，清单全靠用例自己加。
       * manualmode 的用例要测"从半自动切过来"，所以留 semi。 */
      if (CASE0 === 'manual' || CASE0 === 'manualrest') profile.mode = 'manual';

      /* 自己排 + 体验模式：先塞一条今天的清单，好让"模拟完成今天"有东西可点 */
      var seedDays = {};
      var seedManualTags = [];
      var seedFocusLive = null;      // 番茄钟"上次没结束"的存档
      var seedAdvanced = { subtask: false, repeat: false, remind: false };
      function mkSeedTask(id, title, mid, unit, amount, minutes, order, extra) {
        var m = window.YT.MODULE_BY_ID[mid];
        var work = null;
        if (mid && amount) {
          if (unit === '组') work = { sets: amount };
          else if (unit === '节') work = { units: amount };
          else work = { amount: amount };
        }
        var t = {
          id: id, kind: 'task', title: title, userAdded: true,
          moduleId: mid || null, moduleName: m ? m.name : '', work: work,
          minutes: minutes, note: '', subtasks: [], repeat: null, remind: null,
          order: order, status: 'todo', actualMinutes: null, focusMinutes: 0,
        };
        if (extra) Object.keys(extra).forEach(function (k) { t[k] = extra[k]; });
        return t;
      }
      if (CASE0 === 'manualdemo') {
        profile.mode = 'manual';
        seedDays[today] = {
          date: today, isRest: false, stage: null, mood: null,
          tasks: [mkSeedTask('seed-1', '种子任务', 'zlfx', '组', 1, 25, 1)],
        };
      }
      /* 番茄钟恢复：一条是"刚走完不久"（该自动接着走），一条是"停在很久以前"（该问一句） */
      if (CASE0 === 'manualresume' || CASE0 === 'manualresumestale') {
        profile.mode = 'manual';
        var nowMs = Date.now();
        var endsAt = CASE0 === 'manualresume' ? nowMs + 12 * 60 * 1000 : nowMs - 9 * 60 * 60 * 1000;
        seedManualTags = [{ id: 'u-shot', name: '民法' }];
        seedDays[today] = {
          date: today, isRest: false, stage: null, mood: null,
          tasks: [mkSeedTask('s2', '言语理解 专项刷题', 'yy', '题', 30, 45, 1)],
        };
        seedFocusLive = {
          mode: 'pomodoro', phase: 'work', running: true,
          startedAt: new Date(endsAt - 25 * 60 * 1000).toISOString(),
          phaseStartAt: new Date(endsAt - 25 * 60 * 1000).toISOString(),
          endsAt: endsAt, remainMs: null, elapsedMs: 0, phaseMs: 25 * 60 * 1000,
          longBreak: false, workMin: 25, shortMin: 5, longMin: 15,
          rounds: 4, round: 1, taskId: 's2', dateKey: today, moduleId: 'yy',
          label: '言语理解 专项刷题',
        };
      }
      /* 新功能驱动用例：编辑 / 改期 / 复制 / 撤销 / 批量排 / 计划页两档 */
      /* manualseries 用同一份数据，但只截图不跑驱动（方便看菜单、浮条、表单） */
      if (CASE0 === 'manualnew' || CASE0 === 'manualseries') {
        profile.mode = 'manual';
        profile.weekdayMinutes = 90;      // 目标压低一点，好验证"今天排超了"
        profile.restDays = [0];           // 周日休息：批量排要跳过它
        seedAdvanced = { subtask: true, repeat: true, remind: false };
        seedManualTags = [{ id: 'u-shot', name: '民法' }];
        seedDays[today] = {
          date: today, isRest: false, stage: null, mood: null,
          tasks: [
            mkSeedTask('s1', '资料分析 第 3 组', 'zlfx', '组', 1, 30, 1, { status: 'done', focusMinutes: 28 }),
            mkSeedTask('s2', '言语理解 专项刷题', 'yy', '题', 30, 45, 2),
          ],
        };
        /* 一条已经展开好的"每天重复"，用来验证系列 */
        var seriesRoot = mkSeedTask('r1', '民法 · 每天背', 'u-shot', '节', 1, 20, 3);
        seriesRoot.seriesId = 's-r1';
        seriesRoot.repeat = { freq: 'daily', until: '' };
        seedDays[today].tasks.push(seriesRoot);
        for (var ri = 1; ri <= 3; ri++) {
          var rk = window.YT.engine.toKey(window.YT.engine.addDays(new Date(), ri));
          var rc = mkSeedTask('r1-' + ri, '民法 · 每天背', 'u-shot', '节', 1, 20, 1);
          rc.seriesId = 's-r1';
          rc.repeatOf = 'r1';
          rc.seriesFreq = 'daily';
          seedDays[rk] = { date: rk, isRest: false, stage: null, mood: null, tasks: [rc] };
        }
      }
      if (CASE0 === 'manualshot') {
        profile.mode = 'manual';
        seedManualTags = [{ id: 'u-shot', name: '民法' }];
        seedDays[today] = {
          date: today, isRest: false, stage: null, mood: null,
          tasks: [
            mkSeedTask('s1', '资料分析 第 3 组', 'zlfx', '组', 1, 30, 1, { status: 'done', focusMinutes: 28 }),
            mkSeedTask('s2', '言语理解 专项刷题', 'yy', '题', 30, 45, 2),
            mkSeedTask('s3', '整理错题本', null, '', 0, 25, 3, {
              subtasks: [{ id: 'ss1', title: '重做昨天错的 5 道', done: true },
                         { id: 'ss2', title: '记下错因', done: false },
                         { id: 'ss3', title: '归到对应知识点', done: false }],
            }),
            mkSeedTask('s6', '民法总则 · 第 2 讲', 'u-shot', '节', 1, 40, 4,
              { status: 'done', actualMinutes: 35, moduleName: '民法' }),
          ],
        };
        var d2 = window.YT.engine.toKey(window.YT.engine.addDays(new Date(), 2));
        var d3 = window.YT.engine.toKey(window.YT.engine.addDays(new Date(), 5));
        seedDays[d2] = { date: d2, isRest: false, stage: null, mood: null,
          tasks: [mkSeedTask('s4', '申论 小题 1 道', 'slw', '道', 1, 40, 1)] };
        seedDays[d3] = { date: d3, isRest: false, stage: null, mood: null,
          tasks: [mkSeedTask('s5', '模考一套', null, '', 0, 120, 1)] };
      }

      window.localStorage.setItem('yang-toolbox/v1', JSON.stringify({
        version: 1,
        userId: 'local-user',
        profile: profile,
        roadmap: E.buildRoadmap(profile, today),
        days: seedDays,
        focus: { settings: { work: 25, short: 5, long: 15, rounds: 4 }, sessions: [], live: seedFocusLive },
        manual: { settings: { advanced: seedAdvanced, askActual: true }, tags: seedManualTags },
        rounds: [],
        weeklyLog: [],
        weekMark: {},
        ui: { screen: 'today', onboardStep: 0 },
        createdAt: new Date().toISOString(),
      }));
    })();
  </script>

  <script src="../js/demo.js"></script>
  <script src="../js/app.js"></script>

  <script>
    /* =====================================================================
     * 驱动：一步步点，检查每一步的结果，最后把结论写回页面。
     * 用 --dump-dom 跑的时候，看到的就是下面这段文本。
     * =================================================================== */

    (function () {
      var CASE = new URLSearchParams(location.search).get('case') || 'demo';
      var out = [];
      var bad = 0;

      function ok(m) { out.push('ok    ' + m); }
      function fail(m) { bad++; out.push('FAIL  ' + m); }
      function info(m) { out.push('      ' + m); }

      function $(sel) { return document.querySelector(sel); }
      function stored() {
        return JSON.parse(window.localStorage.getItem('yang-toolbox/v1'));
      }
      function click(sel) {
        var el = $(sel);
        if (!el) { fail('missing element: ' + sel); return false; }
        el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
        return true;
      }
      function doneCount() {
        var st = stored();
        var day = st.days[st.simDate || window.YT.engine.toKey(new Date())];
        if (!day) return -1;
        return (day.tasks || []).filter(function (t) { return t.status === 'done'; }).length;
      }
      function taskCount() {
        var st = stored();
        var day = st.days[st.simDate || window.YT.engine.toKey(new Date())];
        return day ? (day.tasks || []).length : -1;
      }

      var steps = [];
      function step(name, fn, wait) { steps.push({ name: name, fn: fn, wait: wait }); }
      /* 更多面板是切换式的，先确认它开着再点里面的东西 */
      function openMore() {
        if (!$('[data-act="demo-run"]')) click('[data-act="demo-more"]');
      }

      /* ---------------- 正式版的样子（不带 ?demo=1） ---------------- */
      /* ---------------- 体验模式 ---------------- */
      /* 问卷最后一步"每个模块你打算听多少节课？"——改了数字，下面那块预览要跟着变 */
      if (CASE === 'onboard') {
        step('walk to the last step', function () {
          click('[data-act="exam-preset"][data-months="4"]');
          for (var i = 0; i < 6; i++) click('[data-act="ob-next"]');
          var h2 = document.querySelector('.onboard h2');
          var t = h2 ? h2.textContent : '';
          if (t.indexOf('每个模块') >= 0) ok('走到问卷最后一步：' + t);
          else fail('没走到最后一步，当前是：' + (t || '(没有 h2)'));
          if ($('#ob-preview')) ok('下面有那块"会是这样"的预览');
          else fail('没有预览块');
        });

        step('改课节数，预览要跟着变', function () {
          var before = $('#ob-preview').textContent;
          var el = $('[data-act="set-units"][data-m="zlfx"]');
          if (!el) return fail('找不到课节数输入框');
          el.value = '2';
          el.dispatchEvent(new Event('input', { bubbles: true }));
          var after = $('#ob-preview').textContent;
          if (after !== before) ok('改了，预览跟着变');
          else fail('改了课节数，预览没变');
        });

        step('改每节课时长，预览要跟着变', function () {
          var before = $('#ob-preview').textContent;
          var beforeBase = before.match(/基础期(\d+)/);
          var el = $('[data-act="set-lesson"]');
          if (!el) return fail('找不到时长输入框');
          el.value = '100';
          el.dispatchEvent(new Event('input', { bubbles: true }));
          var after = $('#ob-preview').textContent;
          if (after !== before) ok('改了时长，预览跟着变');
          else fail('改了每节课时长，预览没变');
          var afterBase = after.match(/基础期(\d+)/);
          if (beforeBase && afterBase && beforeBase[1] !== afterBase[1]) {
            ok('基础期天数也跟着重算了：' + beforeBase[1] + ' → ' + afterBase[1] + ' 天');
          } else {
            info('基础期天数没变（' + (beforeBase ? beforeBase[1] : '?') + '）');
          }
          out.push('      预览：' + after.replace(/\s+/g, ' ').slice(0, 90));
        });

        step('改听课倍速，预览要跟着变', function () {
          var before = $('#ob-preview').textContent;
          var el = $('[data-act="set-speed"]');
          if (!el) return fail('找不到倍速输入框');
          el.value = '2';
          el.dispatchEvent(new Event('input', { bubbles: true }));
          var after = $('#ob-preview').textContent;
          if (after !== before) ok('改了倍速，预览跟着变');
          else fail('改了听课倍速，预览没变');
          out.push('      预览：' + after.replace(/\s+/g, ' ').slice(0, 90));
        });

        /* 走到这一步的最后一关：问卷能不能正常收尾、生成计划 */
        step('生成我的备考计划', function () {
          click('[data-act="ob-next"]');
        }, 6000);

        step('计划生成成功', function () {
          var st = stored();
          if (st && st.profile && st.roadmap) ok('问卷正常收尾，计划生成了');
          else fail('问卷走完却没有 profile/roadmap');
          if ($('.today-head')) ok('落在今日页');
          else fail('没有落在今日页');
          var txt = $('#app').textContent || '';
          if (txt.indexOf('今天') >= 0) ok('今日页正常渲染');
          else fail('今日页没渲染出来');
        });
      }

      /* 改"每个模块听多少节"之后点重排，计划到底变不变 */
      if (CASE === 'units') {
        var snap = {};
        function look() {
          var E = window.YT.engine, st = stored();
          var tk = E.toKey(new Date());
          var byModule = {}, total = 0, days = 0;
          Object.keys(st.days).forEach(function (k) {
            if (k < tk) return;
            var d = st.days[k];
            var hasCourse = false;
            (d.tasks || []).forEach(function (t) {
              if (t.kind !== 'course') return;
              hasCourse = true;
              total += t.units || 0;
              byModule[t.moduleId] = (byModule[t.moduleId] || 0) + (t.units || 0);
            });
            if (hasCourse) days++;
          });
          return {
            declared: st.profile.courseUnits.zlfx,
            need: E.targetUnits(window.YT.MODULE_BY_ID.zlfx, st.profile),
            speed: st.profile.speed,
            base: (st.roadmap && st.roadmap.stages && st.roadmap.stages[0])
              ? st.roadmap.stages[0].studyDays : null,
            total: total,
            zlfx: byModule.zlfx || 0,
            days: days,
            forecast: JSON.stringify(st.forecast || null).slice(0, 120),
          };
        }

        step('open settings', function () {
          click('[data-act="goto"][data-to="mine"]');
          if (document.body.textContent.indexOf('添加到桌面') >= 0) {
            ok('我的页有「添加到桌面」入口');
            click('[data-act="install-open"]');
            var ov = $('#overlay');
            if (ov && ov.textContent.indexOf('长按桌面图标') >= 0) ok('添加到桌面弹窗有删除说明');
            else fail('添加到桌面弹窗没有删除说明');
            click('[data-act="install-close"]');
          } else {
            fail('我的页没有「添加到桌面」入口');
          }
          click('[data-act="goto"][data-to="settings"]');
          if ($('[data-act="set-units"][data-m="zlfx"]')) ok('设置页打开了');
          else fail('设置页没打开，或找不到课节数输入框');
          if ($('.regen-note') && !$('[data-act="regen"]')) ok('底部是自动重排的状态行，不再需要手点按钮');
          else fail('设置页底部还是老样子（还有"重新生成"按钮？）');
        });

        step('before', function () {
          snap.before = look();
          out.push('      改之前：' + JSON.stringify(snap.before));
        });

        step('change to 2 auto-regens', function () {
          var el = $('[data-act="set-units"][data-m="zlfx"]');
          if (!el) return fail('找不到资料的输入框');
          var live = el.parentNode.querySelector('.unit-live');
          var liveBefore = live ? live.textContent : '(没有)';
          el.value = '2';
          el.dispatchEvent(new Event('input', { bubbles: true }));
          var st = stored();
          if (Number(st.profile.courseUnits.zlfx) === 2) ok('输入框的值存进 profile 了（' + st.profile.courseUnits.zlfx + '）');
          else fail('输入框的值没存进去（' + st.profile.courseUnits.zlfx + '）');
          var liveAfter = live ? live.textContent : '(没有)';
          if (live && liveAfter !== liveBefore) ok('旁边的进度立刻跟着变：' + liveBefore + ' → ' + liveAfter);
          else fail('旁边的进度没跟着变（还是 ' + liveAfter + '）');
        }, 1200);

        step('after', function () {
          snap.after = look();
          out.push('      改之后：' + JSON.stringify(snap.after));
          var b = snap.before, a = snap.after;
          if (a.need !== b.need) ok('目标节数变了：' + b.need + ' → ' + a.need);
          else fail('目标节数没变（还是 ' + a.need + '）');
          if (a.zlfx !== b.zlfx) ok('资料排到的课变了：' + b.zlfx + ' → ' + a.zlfx + ' 节');
          else fail('资料排到的课没变（还是 ' + a.zlfx + ' 节）');
          /* 总课时不变是这个场景的正常结果：每天排多少听课是按当天时间的固定比例算的，
           * 少听的那部分时间会分给别的科目。面板里会说清楚。 */
          info('未来两周排的课总节数 ' + b.total + ' → ' + a.total +
               '（排不完的情况下总数不变，只是换了科目）');
          var note = $('.regen-note');
          var noteTxt = note ? note.textContent : '';
          if (noteTxt.indexOf('已重排') >= 0) ok('底部显示了重排结果：' + noteTxt);
          else fail('底部没显示重排结果：' + (noteTxt || '(没有这行)'));
        });

        step('plan page explains the leftover', function () {
          click('[data-act="goto"][data-to="plan"]');
          var planTxt = $('#app').textContent || '';
          if (planTxt.indexOf('排不进去') >= 0) ok('计划页写清了有课排不进去');
          else fail('计划页没说明为什么改了没反应：' + planTxt.slice(0, 120));
        });

        /* 用户报的第二件事：改"每节课时长"和"听课倍速"，计划应该立刻跟着变 */
        step('change speed auto-regens', function () {
          click('[data-act="goto"][data-to="settings"]');
          snap.preSpeed = look();
          var el = $('[data-act="set-speed"]');
          if (!el) return fail('找不到倍速输入框');
          el.value = '2';
          el.dispatchEvent(new Event('input', { bubbles: true }));
        }, 1200);

        step('speed took effect', function () {
          var now = look();
          out.push('      改倍速后：' + JSON.stringify(now));
          if (Number(now.speed) === 2) ok('倍速存进去了（' + now.speed + '）');
          else fail('倍速没存进去（' + now.speed + '）');
          var note = $('.regen-note');
          var noteTxt = note ? note.textContent : '';
          if (noteTxt.indexOf('听课时长') >= 0) ok('底部立刻写出变化：' + noteTxt);
          else fail('底部没写出变化：' + (noteTxt || '(没有这行)'));
          /* 这个用例是"每天 120 分钟、每科 10 节"的极端档：课本来就排不完，
           * 提速只是让每天多听一点、排不进去的课从 24 节降到 18.5 节，
           * 基础期长度被冲刺窗口卡着，不会提前。 */
          info('基础期 ' + snap.preSpeed.base + ' → ' + now.base + ' 天' +
               '（课排不完时日期不动，但排不进去的量会减少）');
        });
      }

      if (CASE === 'restart') {
        step('restart goes back to the questionnaire', function () {
          openMore();
          if (!click('[data-act="demo-restart"]')) return;
          if (!$('[data-act="confirm-yes"]')) return fail('「重新开始」没弹确认框');
          click('[data-act="confirm-yes"]');
          var st = stored();
          if (!st || !st.profile) ok('重新开始：profile 清空了');
          else fail('重新开始没清掉 profile');
          if (!$('.demo-bar')) ok('回到问卷第一页，体验工具条不再显示');
          else fail('已经回到问卷了，体验工具条还在');
          var txt = $('#app').textContent;
          if (txt.indexOf('考试日期') >= 0 && $('#app').querySelector('[data-act="set-exam-draft"]')) {
            ok('问卷第一页（考试日期）渲染出来了');
          } else fail('问卷第一页没渲染出来：' + txt.slice(0, 60));
        });
      }

      if (CASE === 'newbits') {
        var phaseTest = {};
        step('回顾任务置顶', function () {
          var E = window.YT.engine;
          var live = window.__ytDebug();
          var tk = live.simDate || E.toKey(new Date());
          var day = live.days[tk];
          if (!day) return fail('今日没有排出来');

      /* 自己排：休息日只是视觉标记，不阻止加任务 */

      /* 自己排下的体验模式：模拟完成 / 下一天 / 断更都不能被这个分支弄坏 */
      if (CASE === 'manualdemo') {

      /* 问卷第 5 步选"自己排"→ 跳过第 6 步（各模块课节数） */
      /* ---------------- 自己排：编辑 / 系列 / 改期 / 复制 / 撤销 / 批量排 / 计划页 ---------------- */
      if (CASE === 'manualnew') {
        var nt = window.YT.engine.toKey(new Date());
        var nTomorrow = window.YT.engine.toKey(window.YT.engine.addDays(new Date(), 1));
        var liveState = function () { return window.__ytDebug(); };
        var dayTasks = function (k) { return ((stored().days[k] || {}).tasks) || []; };
        var byId = function (id) {
          var hit = null;
          Object.keys(stored().days).forEach(function (k) {
            (stored().days[k].tasks || []).forEach(function (t) { if (t.id === id) hit = t; });
          });
          return hit;
        };
        var futureKeys = function () {
          return Object.keys(stored().days).filter(function (k) { return k > nt; });
        };

        step('今日：今天排了多久 · 目标', function () {
          var el = document.querySelector('.today-total');
          if (el && el.textContent.indexOf('今天排了') >= 0 && el.textContent.indexOf('目标') >= 0) {
            ok('今日页有总量和目标：' + el.textContent.trim());
          } else fail('没有"今天排了 / 目标"那一行');
          if (el && el.classList.contains('over')) ok('排超目标时只换个颜色，不报警');
          else fail('排超目标没有标识');
        });

        step('今日：一条都没填预计时长，整行不出现', function () {
          var live = liveState();
          var backup = {};
          (live.days[nt].tasks || []).forEach(function (t) { backup[t.id] = t.minutes; t.minutes = 0; });

          click('[data-act="goto"][data-to="today"]');

          (live.days[nt].tasks || []).forEach(function (t) { t.minutes = backup[t.id]; });

          if (document.querySelector('.today-total')) ok('填回预计时长后又出现');
          else fail('恢复预计时长后没出现');
        });

        step('编辑：只改该改的，打卡 / 专注 / 排序不动', function () {
          var before = byId('s1');

          click('[data-act="m-menu"][data-task="s1"]');

          else fail('改没生效：' + JSON.stringify({ t: after && after.title, m: after && after.minutes }));
          if (after && after.id === snap.id && after.status === snap.status &&
              after.focusMinutes === snap.f && after.order === snap.order) {
            ok('id / 打卡 / 专注分钟 / 排序一个都没动');

        step('系列：保存时先问「只改这一条 / 这一串都改」', function () {

          var root = byId('r1');

          else fail('只改一条没生效：' + root.title + ' / ' + copy.title);
        });

        step('系列：走「改这一串」会同步到还没打卡的', function () {
          click('[data-act="m-menu"][data-task="r1"]');
          if (!$('[data-act="m-edit-series"]')) return fail('菜单里没有「改这一串」');
          click('[data-act="m-edit-series"]');
          var input = $('[data-act="m-f"][data-k="title"]');
          input.value = '民法 · 每天 1 讲';
          input.dispatchEvent(new Event('input', { bubbles: true }));
          click('[data-act="m-edit-save"]');
          var titles = futureKeys().map(function (k) { return dayTasks(k)[0].title; });
          if (titles.length && titles.every(function (t) { return t === '民法 · 每天 1 讲'; })) {
            ok('一串 ' + titles.length + ' 条都改了');
          } else fail('没有整串同步：' + JSON.stringify(titles));
        });

        step('系列：以后都删掉 + 撤销', function () {
          var before = futureKeys().length;
          click('[data-act="m-menu"][data-task="r1"]');
          click('[data-act="m-series-del"]');
          if (!$('[data-act="confirm-yes"]')) return fail('删一串没有确认框');
          click('[data-act="confirm-yes"]');
          if (futureKeys().length === 0) ok('今天以后的 ' + before + ' 天全删了');
          else fail('还剩 ' + futureKeys().length + ' 天没删');
          var ub = $('#undobar');
          if (ub && ub.classList.contains('show')) ok('底部浮出「已删除 · 撤销」');
          else fail('没有撤销条');

          if (futureKeys().length === before) ok('撤销把删掉的都原样放回来了');
          else fail('撤销没生效：' + futureKeys().length + ' / ' + before);
        });

        step('改到别的日子', function () {
          click('[data-act="m-menu"][data-task="s2"]');
          click('[data-act="m-move-open"]');
          if (!$('[data-act="m-move-to"]')) return fail('没有打开的改期面板');
          click('[data-act="m-move-to"][data-v="' + nTomorrow + '"]');
          var moved = dayTasks(nTomorrow).filter(function (t) { return t.id === 's2'; })[0];
          if (moved) ok('条目挪到了明天');
          else fail('没挪过去');
          if (dayTasks(nt).every(function (t) { return t.id !== 's2'; })) ok('今天这边不再有它');
          else fail('今天还留着一条');
          if (dayTasks(nt).every(function (t, i) { return t.order === i + 1; })) ok('今天的编号重新排连续了');
          else fail('编号没重排');
        });

        step('复制一条', function () {
          var n0 = dayTasks(nt).length;
          click('[data-act="m-menu"][data-task="s1"]');
          click('[data-act="m-copy"]');
          var list = dayTasks(nt);
          if (list.length === n0 + 1) ok('同一天多出一条');
          else fail('复制没生效');
          var dup = list.filter(function (t) { return t.title === '资料分析 第 4 组'; });
          if (dup.length === 2 && dup[1].status === 'todo' && dup[1].id !== dup[0].id && !dup[1].seriesId) {
            ok('复制件是干净的待办，且不带系列号');
          } else fail('复制件不对：' + JSON.stringify(dup[1]));
        });

        step('批量排：写进去的是普通清单条目', function () {
          click('[data-act="goto"][data-to="plan"]');
          click('[data-act="m-batch-open"]');
          if (!$('#batch-preview')) return fail('批量排弹窗没打开');
          click('[data-act="m-batch-tag"][data-v="zlfx"]');
          click('[data-act="m-batch-wd"][data-v="6"]');   // 加上周六
          click('[data-act="m-batch-wd"][data-v="0"]');   // 加上周日（休息日，应该跳过）
          var prev = $('#batch-preview').textContent;
          if (prev.indexOf('会排') >= 0 && prev.indexOf('条') >= 0) ok('预览会说清排几条：' + prev.trim().slice(0, 40));
          else fail('预览没说明排多少：' + prev);
          var before = Object.keys(stored().days).length;
          click('[data-act="m-batch-apply"]');
          var after = Object.keys(stored().days).length;
          if (after >= before) ok('批量排把日子写进去了（' + before + ' → ' + after + ' 天有内容）');
          else fail('批量排没写进去');
          var rest = Object.keys(stored().days).filter(function (k) {
            var d = window.YT.engine.parseKey(k);
            return (d.getDay() === 0) && (stored().days[k].tasks || []).some(function (t) { return t.title === '资料'; });

        step('计划页：本周列表 + 往后翻月', function () {
          click('[data-act="m-plan-view"][data-v="week"]');

          click('[data-act="m-plan-view"][data-v="month"]');

          else fail('下个月还是翻不动');

          if (label) ok('翻到下个月正常渲染：' + (document.querySelector('.section-title') ? '' : '') + stored().ui.manMonth);
          else fail('翻月之后日历没渲染');

          click('[data-act="goto"][data-to="stats"]');

          click('[data-act="arch-open"]');

      if (CASE === 'manualresumestale') {

      if (CASE === 'onboardmanual') {

          var st = stored();

          else fail('模式不对：' + (st.profile && st.profile.mode));

      if (CASE === 'fresh') {

          else fail('fresh 参数还挂在网址上');

      if (CASE === 'demo') {

          var st = stored();
          if (st.simDate !== startDate) return fail('往回走两次没回到第一天（' + st.simDate + '，想要 ' + startDate + '）');
          if (!st.weekMark[wk]) ok('往回走清掉了重排标记，再往前走才会按新数据重算');
          else fail('往回走没清重排标记：' + JSON.stringify(st.weekMark));
        });

        step('open more', function () {
          openMore();
          if ($('[data-act="demo-run"][data-v="30"]')) ok('更多选项展开了');
          else fail('更多选项没展开');
        });

        step('date input is clickable', function () {
          /* 回归用例：体验模式的 click 监听绝对不能对日历控件调 preventDefault，
           * 一调整个控件就点不动了。 */
          var el = $('[data-act="demo-goto"]');
          if (!el) return fail('找不到"跳到某一天"的日期输入框');
          var ev = new MouseEvent('click', { bubbles: true, cancelable: true });
          el.dispatchEvent(ev);
          if (ev.defaultPrevented) fail('日历控件的点击被 preventDefault 拦住了，点不动');
          else ok('日历控件点得动（点击没被拦）');
        });

        step('date jump works', function () {
          var E = window.YT.engine;
          var st0 = stored();
          var target = E.toKey(E.addDays(E.parseKey(st0.simDate || E.toKey(new Date())), 3));
          var el = $('[data-act="demo-goto"]');
          el.value = target;
          el.dispatchEvent(new Event('change', { bubbles: true }));
          var st = stored();
          if (st.simDate === target) ok('跳到 ' + target + ' 生效了');
          else fail('跳日期没生效（simDate=' + st.simDate + '，想要 ' + target + '）');
        });

        step('quick jump chips', function () {
          var E = window.YT.engine;
          var st0 = stored();
          var want = E.toKey(E.addDays(E.parseKey(st0.profile.examDate), -7));
          click('[data-act="demo-jump"][data-v="exam-7"]');
          var st = stored();
          if (st.simDate === want) ok('「跳到考试前 7 天」生效（' + want + '）');
          else fail('快捷跳转没生效（' + st.simDate + '，想要 ' + want + '）');
          click('[data-act="demo-jump"][data-v="exam"]');
          if (stored().simDate === st0.profile.examDate) ok('「跳到考试日」生效');
          else fail('跳到考试日没生效');
          /* 跳走之后回到今天，免得影响后面的用例（比如再往后跑 30 天会撞上考试日） */
          click('[data-act="demo-today"]');
        });

        step('rate chips', function () {
          click('[data-act="demo-rate"][data-v="1"]');
          var st = stored();
          if (Number(st.ui.demoRate) === 1) ok('完成率切成全部完成');
          else fail('完成率没切成 1（' + st.ui.demoRate + '）');
          click('[data-act="demo-fill"]');
          if (doneCount() === taskCount() && taskCount() > 0) ok('全部完成：' + doneCount() + ' / ' + taskCount());
          else fail('全部完成没生效（' + doneCount() + ' / ' + taskCount() + '）');
        });

        step('run 30 days', function () {
          /* 可能是"回到今天"之后（simDate 为 null），拿真实今天当基准 */
          var before = stored().simDate || window.YT.engine.toKey(new Date());
          click('[data-act="demo-run"][data-v="30"]');
          var st = stored();
          if (st.simDate > before) ok('自动跑 30 天：' + before + ' -> ' + st.simDate);
          else fail('自动跑没生效（' + st.simDate + '）');
        });

        step('back to today', function () {
          click('[data-act="demo-today"]');
          var st = stored();
          var E = window.YT.engine;
          if (!st.simDate && $('.demo-bar')) ok('回到真实今天，工具条还在');
          else fail('回到今天没生效（simDate=' + st.simDate + '）');
          info('today=' + E.toKey(new Date()));
        });

        step('skip 5 days', function () {
          openMore();
          if (!$('[data-act="demo-skip"][data-v="5"]')) return fail('更多面板里的"停 5 天"没找到');
          click('[data-act="demo-skip"][data-v="5"]');
          var st = stored();
          if (st.ui.restartSeenOn === st.simDate) ok('模拟断更：跳到 ' + st.simDate + '，断更提示只弹一次');
          else fail('模拟断更的 restartSeenOn 不对（' + st.ui.restartSeenOn + ' vs ' + st.simDate + '）');
          var ov = $('#overlay');
          info('restartInfo=' + JSON.stringify(window.YT.engine.restartInfo(st, st.simDate)));
          if (ov && ov.className.indexOf('overlay hidden') === -1) ok('断更回来弹出了学习档案');
          else info('断更回来没有弹学习档案（可能这天是休息日）');
          if (ov) { ov.className = 'overlay hidden'; ov.innerHTML = ''; }
        });

        step('rewind', function () {
          openMore();
          var st0 = stored();
          var keep = st0.simDate;
          click('[data-act="demo-rewind"]');
          if (!$('[data-act="confirm-yes"]')) { fail('从这天重来没弹确认框'); return; }
          click('[data-act="confirm-yes"]');
          var st = stored();
          var later = Object.keys(st.days).filter(function (k) { return k > keep; });
          var touchedLater = later.filter(function (k) {
            var d = st.days[k];
            return d && ((d.tasks || []).some(function (t) { return t.status !== 'todo'; }) || d.mood);
          });
          if (touchedLater.length === 0) ok('从这天重来：' + keep + ' 之后的记录清掉了，还剩 ' + later.length + ' 天（都是重排出来的）');
          else fail('从这天重来没清干净，还剩 ' + touchedLater.length + ' 天有记录');
        });

        step('exit demo', function () {
          openMore();
          if (!click('[data-act="demo-off"]')) return;
          if (!$('.demo-bar')) ok('退出体验模式后工具条消失');
          else fail('退出体验模式后工具条还在');
          if (location.search.indexOf('demo=1') === -1) ok('退出后网址里的 ?demo=1 也去掉了');
          else fail('退出后网址还挂着 ?demo=1');
        });
      }

      /* ---------------- 逐步执行 ---------------- */

      var i = 0;
      function run() {
        if (i >= steps.length) return finish();
        var s = steps[i++];
        out.push('-- ' + s.name);
        try {
          var r = s.fn();
          if (typeof r === 'number') s.wait = r;
        } catch (e) { fail('抛异常：' + (e && e.message)); }
        setTimeout(run, s.wait || 40);
      }

      function finish() {
        var errs = window.__errs || [];
        if (errs.length) { bad += errs.length; out.push('FAIL  运行时报错 ' + errs.length + ' 条'); errs.forEach(function (e) { out.push('      ' + e); }); }
        else ok('全程没有 JS 报错');
        out.push('');
        out.push(bad ? ('结果：' + bad + ' 处不对') : '结果：全部通过');
        document.body.innerHTML = '<pre id="result">' + out.join('\n') + '</pre>';
      }

      /* plain 那一档最后会 reload，所以只在 demo 档跑驱动 */
      if (CASE === 'plain') {
        setTimeout(function () {
          if ($('.demo-bar')) fail('没有 ?demo=1，体验工具条不该出现');
          else ok('没有 ?demo=1 时不显示体验工具');
          if ($('.today-head')) ok('今日页正常渲染');
          else fail('今日页没渲染出来');
          var stateLine = $('.today-head .state');
          if (stateLine && stateLine.textContent.indexOf('听课') >= 0) {
            ok('今日页顶部有课程总进度：' + stateLine.textContent.trim());
          } else {
            fail('今日页顶部没有课程总进度');
          }

          click('[data-act="goto"][data-to="mine"]');
          if (document.body.textContent.indexOf('添加到桌面') >= 0) {
            ok('我的页有「添加到桌面」入口');
            /* 模拟安卓 Chrome 的 beforeinstallprompt，验证一键安装按钮真的会调系统窗口 */
            var fakeInstall = new Event('beforeinstallprompt');
            fakeInstall.prompt = function () { fakeInstall.prompted = true; };
            fakeInstall.userChoice = { then: function (cb) { cb({ outcome: 'accepted' }); return { catch: function () {} }; } };
            window.dispatchEvent(fakeInstall);
            click('[data-act="install-open"]');
            var ov0 = $('#overlay');
            if (ov0 && ov0.textContent.indexOf('立即添加到桌面') >= 0) {
              ok('安卓支持时显示一键安装按钮');
            } else {
              fail('安卓路径没有显示一键安装按钮');
            }
            if (ov0 && ov0.textContent.indexOf('长按桌面图标') >= 0) ok('添加到桌面弹窗有删除说明');
            else fail('添加到桌面弹窗没有删除说明');
            click('[data-act="install-do"]');
            if (fakeInstall.prompted) ok('立即添加到桌面会调用系统安装窗口');
            else fail('立即添加到桌面没有调用系统安装窗口');
          } else {
            fail('我的页没有「添加到桌面」入口');
          }
          click('[data-act="goto"][data-to="settings"]');
          if (document.body.textContent.indexOf('重新开始') >= 0) ok('设置页里有「重新开始」');
          else fail('设置页里没有「重新开始」');
          if (document.body.textContent.indexOf('常识不专门学') >= 0 &&
              document.body.textContent.indexOf('常识靠平时积累') >= 0) {
            ok('常识有单独的「不专门学」入口和说明');
          } else {
            fail('常识的「不专门学」入口没渲染出来');
          }
          if ($('[data-act="set-base-end"]') && $('[data-act="set-sprint-start"]')) {
            ok('设置页有阶段边界输入');
          } else {
            fail('设置页没有阶段边界输入');
          }
          if (document.body.textContent.indexOf('体验模式') >= 0) {
            ok('设置页有体验模式开关');
          } else {
            fail('设置页没有体验模式开关');
          }
          /* 折叠头展开后，标题不应该在内容里再出现一次 */
          click('[data-act="fold-toggle"][data-k="settings:strength"]');
          var foldTxt = ($('#app') || document.body).textContent;
          var foldCount = (foldTxt.match(/各模块强度/g) || []).length;
          if (foldCount === 1) ok('折叠展开后没有重复标题');
          else fail('折叠展开后标题重复了 ' + foldCount + ' 次');
          click('[data-act="goto"][data-to="plan"]');
          if (document.body.textContent.indexOf('调整阶段') >= 0) {
            ok('计划页有「调整阶段」入口');
          } else {
            fail('计划页没有「调整阶段」入口');
          }

          /* 半自动的导航一行不改：还是 4 个 tab，统计挂在「我的」下面。 */
          var semiTabs = document.querySelectorAll('.tabbar .tab').length;
          if (semiTabs === 4) ok('半自动还是 4 个 tab');
          else fail('半自动 tab 数量变了：' + semiTabs);
          if (!$('.tabbar [data-to="stats"]')) ok('半自动没有独立的统计 tab');
          else fail('半自动多了统计 tab');
          click('[data-act="goto"][data-to="mine"]');
          if (document.querySelector('.menu-row[data-to="stats"]')) ok('半自动的「我的」里保留数据统计入口');
          else fail('半自动「我的」没有数据统计入口');
          click('[data-act="goto"][data-to="stats"]');
          if ($('.page-back')) ok('半自动的统计页保留「← 我的」返回键');
          else fail('半自动统计页的返回键没了');

          /* 半自动/全自动的工具页本轮一行不改：还是那句"正在准备中"，
           * 番茄钟只挂在「自己排」那一格。 */
          click('[data-act="goto"][data-to="tools"]');
          var toolsTxt = ($('#app') || document.body).textContent || '';
          if (toolsTxt.indexOf('更多公考学习工具正在准备中') >= 0 && toolsTxt.indexOf('番茄钟') === -1) {
            ok('半自动的工具页保持原样，没有番茄钟');
          } else {
            fail('半自动的工具页被改了：' + toolsTxt.slice(0, 60));
          }

          var errs = window.__errs || [];
          if (errs.length) { bad += errs.length; out.push('FAIL  ' + errs.length + ' 处运行时报错'); errs.forEach(function (e) { out.push('      ' + e); }); }
          else ok('全程没有 JS 报错');

          out.push('');
          out.push(bad ? ('结果：' + bad + ' 处不对') : '结果：全部通过');
          document.body.innerHTML = '<pre id="result">' + out.join('\n') + '</pre>';
        }, 600);
      } else if (CASE === 'manualshot' || CASE === 'manualseries') {
        /* 只为了截图：自己排的今日 / 工具 / 番茄钟 / 计划 / 加一条 */
        setTimeout(function () {
          var mt = new URLSearchParams(location.search).get('to');
          if (mt === 'tools') { click('[data-act="goto"][data-to="tools"]'); return; }
          if (mt === 'toolsexpand') {
            click('[data-act="goto"][data-to="tools"]');
            click('[data-act="focus-fold"]');
            return;
          }
          if (mt === 'plan') { click('[data-act="goto"][data-to="plan"]'); return; }
          if (mt === 'planweek') {
            click('[data-act="goto"][data-to="plan"]');
            click('[data-act="m-plan-view"][data-v="week"]');
            return;
          }
          if (mt === 'batch') {
            click('[data-act="goto"][data-to="plan"]');
            click('[data-act="m-batch-open"]');
            return;
          }
          if (mt === 'planday') {
            click('[data-act="goto"][data-to="plan"]');
            var cells = document.querySelectorAll('[data-act="m-cal"]');
            var pick = null, tk0 = window.YT.engine.toKey(new Date());
            for (var ci = cells.length - 1; ci >= 0; ci--) {
              if (cells[ci].getAttribute('data-v') > tk0 &&
                  (cells[ci].textContent || '').indexOf('项') >= 0) {
                pick = cells[ci].getAttribute('data-v'); break;
              }
            }
            if (pick) click('[data-act="m-cal"][data-v="' + pick + '"]');
            return;
          }
          if (mt === 'settings') {
            click('[data-act="goto"][data-to="mine"]');
            click('[data-act="goto"][data-to="settings"]');
            return;
          }
          if (mt === 'actual') {
            click('[data-act="m-done"][data-task="s2"]');
            return;
          }
          if (mt === 'stats') {
            click('[data-act="goto"][data-to="mine"]');
            click('[data-act="goto"][data-to="stats"]');
            return;
          }
          if (mt === 'tagset') {
            click('[data-act="goto"][data-to="mine"]');
            click('[data-act="goto"][data-to="settings"]');
            click('[data-act="fold-toggle"][data-k="settings:tags"]');
            return;
          }
          if (mt === 'add') { click('[data-act="m-add-open"]'); return; }
          if (mt === 'menu') { click('[data-act="m-menu"][data-task="s2"]'); return; }
          if (mt === 'menu-done') { click('[data-act="m-menu"][data-task="s1"]'); return; }
          if (mt === 'seriesmenu') { click('[data-act="m-menu"][data-task="r1"]'); return; }
          if (mt === 'undobar') {
            click('[data-act="m-menu"][data-task="s2"]');
            click('[data-act="m-del"]');
            click('[data-act="confirm-yes"]');
            return;
          }
          if (mt === 'statsarch') { click('[data-act="goto"][data-to="stats"]'); return; }
          if (mt === 'week') {
            click('[data-act="goto"][data-to="plan"]');
            click('[data-act="m-plan-view"][data-v="week"]');
            return;
          }
          if (mt === 'move') {
            click('[data-act="m-menu"][data-task="s2"]');
            click('[data-act="m-move-open"]');
            return;
          }
          if (mt === 'edit') {
            click('[data-act="m-menu"][data-task="s2"]');
            click('[data-act="m-edit"]');
            return;
          }
          if (mt === 'addadv') {
            click('[data-act="goto"][data-to="mine"]');
            click('[data-act="goto"][data-to="settings"]');
            click('[data-act="fold-toggle"][data-k="settings:manual"]');
            click('[data-act="manual-adv"][data-v="subtask"]');
            click('[data-act="manual-adv"][data-v="repeat"]');
            click('[data-act="manual-adv"][data-v="remind"]');
            click('[data-act="goto"][data-to="today"]');
            click('[data-act="m-add-open"]');
            return;
          }
          if (mt === 'focus') {
            click('[data-act="goto"][data-to="tools"]');
            var sel = $('[data-act="focus-task"]');
            if (sel) { sel.value = 's2'; sel.dispatchEvent(new Event('change', { bubbles: true })); }
            click('[data-act="focus-start"]');
            return;
          }
        }, 300);
      } else if (CASE === 'shot') {
        /* 只为了截图：摆一个"走了一周、今天模拟完成"的样子，不动 DOM */
        setTimeout(function () {
          var q = new URLSearchParams(location.search);
          if (q.get('to') === 'settings') {
            click('[data-act="goto"][data-to="mine"]');
            click('[data-act="goto"][data-to="settings"]');
            var w = $('[data-act="wipe"]');
            if (w) w.scrollIntoView({ block: 'center' });
            return;
          }
          if (q.get('to') === 'settings-top') {
            click('[data-act="goto"][data-to="mine"]');
            click('[data-act="goto"][data-to="settings"]');
            return;
          }
          if (q.get('to') === 'phase') {
            click('[data-act="goto"][data-to="mine"]');
            click('[data-act="goto"][data-to="settings"]');
            var ph = $('#phase-plan');
            if (ph) ph.scrollIntoView({ block: 'start' });
            return;
          }
          if (q.get('to') === 'plan') {
            click('[data-act="goto"][data-to="plan"]');
            return;
          }
          if (q.get('to') === 'install') {
            click('[data-act="goto"][data-to="mine"]');
            click('[data-act="install-open"]');
            return;
          }
          click('[data-act="demo-fill"]');
          click('[data-act="demo-next"]');
          click('[data-act="demo-fill"]');
          click('[data-act="demo-next"]');
          if (q.get('more') === '1') click('[data-act="demo-more"]');
        }, 400);
      } else if (steps.length) {
        setTimeout(run, 300);
      }
    })();
  </script>
</body>
</html>
